# Agent only. Read deployment variables with --env-file /opt/general.env.
version: "3"
services:
  agent:
    image: orgaiot-agent:20260928-online
    container_name: aiot-agent
    restart: unless-stopped
    init: true
    ports:
      - "18731:8000"
    environment:
      SECRET_KEY: ${AGENT_SECRET_KEY:?Missing Agent secret key}
      LLM_PROVIDER: openai
      OPENAI_API_KEY: ${AGENT_OPENAI_API_KEY:?Missing cloud model API key}
      OPENAI_API_BASE: ${AGENT_OPENAI_API_BASE:?Missing cloud model API base}
      LLM_MODEL: ${AGENT_LLM_MODEL:?Missing cloud model name}
      EMBEDDING_PROVIDER: disabled
      EMBEDDING_MODEL: ""
      MAX_AGENT_ITERATIONS: ${AGENT_MAX_AGENT_ITERATIONS:-10}
      MAX_EXECUTION_TIME: ${AGENT_MAX_EXECUTION_TIME:-120}
      MAX_TOKENS: ${AGENT_MAX_TOKENS:-4096}
      MAX_TOKENS_PER_CONVERSATION: ${AGENT_MAX_TOKENS_PER_CONVERSATION:-100000}
      TEMPERATURE: ${AGENT_TEMPERATURE:-0.7}
      PLATFORM_SYSTEM_CODE: ${AGENT_PLATFORM_SYSTEM_CODE:-AIOT}
      PLATFORM_MAP_SYS_TYPE: ${AGENT_PLATFORM_MAP_SYS_TYPE:-}
      DEBUG: "false"
      LOCAL_STUDIO_NO_LOGIN: "false"
      DATABASE_URL: sqlite+aiosqlite:///./data/agent.db
      UPLOAD_DIR: ./data/documents
      DATASET_DIR: ./data/datasets
      LOG_DIR: ./data/logs
      PLATFORM_SSO_BASE_URL: http://${ORGAIOT_SSO_ADDR:?Missing SSO address}${ORGAIOT_SSO_API_PREFIX:-/api}
      PLATFORM_DEVICE_BASE_URL: http://${ORGAIOT_DEVICE_ADDR:?Missing device address}/api
      PLATFORM_PM_BASE_URL: http://${ORGAIOT_PM_ADDR:?Missing PM address}/api
      PLATFORM_PE_BASE_URL: http://${ORGAIOT_PE_ADDR:?Missing PE address}/api
      TZ: Asia/Shanghai
    volumes:
      - /opt/agent/runtime:/app/data
    logging:
      options:
        max-size: "10m"
        max-file: "3"
